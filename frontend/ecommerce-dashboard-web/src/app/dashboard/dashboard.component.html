<div class="dashboard">

  <header class="dashboard-header">
    <div class="header-title">
      <h1>Dashboard de Vendas</h1>
      <p class="subtitle">Acompanhe as métricas e desempenho do seu negócio</p>
    </div>
  </header>

  <section class="filter-card">
    <div class="filter-card-header">
      <div class="filter-card-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
        </svg>
        <span>Filtrar Período</span>
      </div>

      @if (startDate() || endDate()) {
        <span class="active-filter-badge">Filtro Ativo</span>
      }
    </div>

    <div class="filter-card-body">
      <div class="filter-inputs">
        <div class="filter-group">
          <label for="startDate">Data Inicial</label>
          <div class="input-with-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <input
              type="date"
              id="startDate"
              [value]="startDate()"
              (change)="onStartDateChange($event)"
              [disabled]="isLoading()"
            />
          </div>
        </div>

        <div class="filter-separator">
          <span>até</span>
        </div>

        <div class="filter-group">
          <label for="endDate">Data Final</label>
          <div class="input-with-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <input
              type="date"
              id="endDate"
              [value]="endDate()"
              (change)="onEndDateChange($event)"
              [disabled]="isLoading()"
            />
          </div>
        </div>
      </div>

      <div class="filter-actions">
        <button
          type="button"
          class="btn-filter"
          (click)="applyFilter()"
          [disabled]="isLoading()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          Aplicar
        </button>

        @if (startDate() || endDate()) {
          <button
            type="button"
            class="btn-clear"
            (click)="clearFilter()"
            [disabled]="isLoading()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
            Limpar
          </button>
        }
      </div>
    </div>
  </section>

  @if (errorMessage()) {
    <div class="error-banner">
      <p>{{ errorMessage() }}</p>
    </div>
  }

  <div class="charts">
    <app-chart-card title="GMV Mensal" [data]="gmvByMonthChart()" type="line"></app-chart-card>
    <app-chart-card title="Pedidos Mensais" [data]="ordersByMonthChart()" type="line"></app-chart-card>
    <app-chart-card title="Ticket Médio Mensal" [data]="averageTicketByMonthChart()" type="line"></app-chart-card>
    <app-chart-card title="GMV por Categoria" [data]="gmvByCategoryChart()" type="bar"></app-chart-card>
    <app-chart-card title="Pedidos por Categoria" [data]="ordersByCategoryChart()" type="bar"></app-chart-card>
    <app-chart-card title="Ticket Médio por Categoria" [data]="averageTicketByCategoryChart()" type="bar"></app-chart-card>
    <app-chart-card title="Itens por Categoria" [data]="itemsByCategoryChart()" type="bar"></app-chart-card>
    <app-chart-card title="GMV por Estado" [data]="gmvByStateChart()" type="bar"></app-chart-card>
    <app-chart-card title="Pedidos por Estado" [data]="ordersByStateChart()" type="bar"></app-chart-card>
    <app-chart-card title="Ticket Médio por Estado" [data]="averageTicketByStateChart()" type="bar"></app-chart-card>
    <app-chart-card title="GMV por Estado do Vendedor" [data]="gmvBySellerStateChart()" type="bar"></app-chart-card>
    <app-chart-card title="Pedidos por Status" [data]="ordersByStatusChart()" type="doughnut"></app-chart-card>
    <app-chart-card title="GMV por Status" [data]="gmvByStatusChart()" type="doughnut"></app-chart-card>
  </div>

</div>
