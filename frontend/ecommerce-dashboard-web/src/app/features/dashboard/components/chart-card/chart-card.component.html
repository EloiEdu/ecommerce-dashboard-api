<div class="chart-card">
  <h3>{{ title }}</h3>
  <div class="chart-container">
    @if (data) {
      <canvas
        baseChart
        [data]="data"
        [type]="type"
        [options]="chartOptions">
      </canvas>
    } @else {
      <div class="chart-loading">
        <p>Carregando...</p>
      </div>
    }
  </div>
</div>
